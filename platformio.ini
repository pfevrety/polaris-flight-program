; PlatformIO Project Configuration File for Fusex Polaris
; Club Aérospatial de CentraleSupélec (CACS) - Sounding Rocket Avionics
;
; Target Microcontrollers: Dual Teensy 4.1 (ARM Cortex-M7 @ 600 MHz)
; - flight_sequencer: Flight state machine, recovery ejection servos, telemetry logging
; - flight_experiments: Active roll control (cold gas), airbrakes stepper, LoRa RFM95W, barometer

[platformio]
default_envs = flight_experiments, flight_sequencer

[env_common]
platform = teensy
board = teensy41
framework = arduino
build_flags =
	-I include
	-Wall
lib_deps = 
	sandeepmistry/LoRa@^0.8.0
	adafruit/Adafruit NeoPixel@^1.15.4
	workloads/SCServo@^1.0.1

[env:flight_sequencer]
extends = env_common
build_src_filter = +<flight_sequencer/> -<flight_experiments/>
build_flags =
	${env_common.build_flags}
	-D ROLE_SEQUENCEUR
	-D COUPLE_WORKING

[env:flight_experiments]
extends = env_common
build_src_filter = +<flight_experiments/> -<flight_sequencer/>
build_flags =
	${env_common.build_flags}
	-D ROLE_EXPERIENCE
	-D DEBUG
	-D COUPLE_WORKING
lib_deps = 
	${env_common.lib_deps}
	arduino-libraries/Stepper@^1.1.3
